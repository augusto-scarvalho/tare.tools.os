name: Node service

# node/ is the GPU node service: a package of its own whose lease tests need Linux flock. It runs here on a
# GitHub-hosted runner instead of the self-hosted suites, which skip node/ (scripts/ci_suite.py).
on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node (Linux flock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: node
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 .
          python -m compileall -q tare_node tests

      - name: Test
        run: python -m pytest -q
